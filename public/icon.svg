<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="6"/>

  <!-- Target Rings -->
  <circle cx="256" cy="230" r="140" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
  <circle cx="256" cy="230" r="105" fill="#1e293b" stroke="#f59e0b" stroke-width="8"/>
  <circle cx="256" cy="230" r="70" fill="#2563eb" stroke="#ef4444" stroke-width="8"/>
  <circle cx="256" cy="230" r="35" fill="#ef4444"/>
  <circle cx="256" cy="230" r="14" fill="#ffffff"/>

  <!-- Dart Arrow Top Right -->
  <path d="M340 146 L400 86 M385 86 L400 86 L400 101" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>

  <!-- App Title -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">PIZARRA</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="4">ANIMALTEC</text>
